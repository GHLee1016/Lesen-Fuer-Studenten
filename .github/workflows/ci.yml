name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (SQLite + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lesen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - run: pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: pytest (SQLite)
        run: pytest -q
      - name: pytest (Postgres)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lesen

  e2e:
    name: End-to-end (${{ matrix.db }})
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lesen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_TOKEN: ci-token
      DB_PATH: ${{ github.workspace }}/ci-data/lesen.db
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://postgres:postgres@127.0.0.1:5432/lesen' || '' }}
      BASE: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          mkdir -p ci-data
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs "$BASE/api/articles" > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Student flow, dashboard and gaze replay
        run: node tests/e2e/demo-flow.mjs e2e-out
      - name: Webcam calibration with a stubbed tracker
        run: node tests/e2e/calibration-stub.mjs e2e-out
      - name: Server log
        if: always()
        run: cat server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.db }}
          path: e2e-out/
          retention-days: 7
