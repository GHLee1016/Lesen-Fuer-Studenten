name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - run: pip install -r backend/requirements.txt -r requirements-dev.txt
      - run: pytest -q

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: unit
    env:
      ADMIN_TOKEN: ci-token
      DB_PATH: ${{ github.workspace }}/ci-data/lesen.db
      BASE: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          mkdir -p ci-data
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs "$BASE/api/articles" > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Student flow, dashboard and gaze replay
        run: node tests/e2e/demo-flow.mjs e2e-out
      - name: Webcam calibration with a stubbed tracker
        run: node tests/e2e/calibration-stub.mjs e2e-out
      - name: Server log
        if: always()
        run: cat server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-out/
          retention-days: 7
