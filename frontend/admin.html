<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>교사용 대시보드 · Lesen für Studenten</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body>
  <!-- Login -->
  <section class="login" id="loginView">
    <form class="card login-card" id="loginForm">
      <div class="brand"><span class="brand-mark">L</span>Lesen für Studenten</div>
      <h1>교사용 대시보드</h1>
      <div class="field">
        <label for="token">관리자 토큰</label>
        <input class="input" id="token" type="password" autocomplete="current-password" required />
        <span class="hint">서버의 ADMIN_TOKEN 환경변수 값이에요.</span>
      </div>
      <span class="error-text" id="loginError" hidden></span>
      <button class="btn btn-primary btn-lg" id="loginBtn" type="submit">로그인</button>
    </form>
  </section>

  <!-- Dashboard -->
  <div id="dashView" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">L</span>Lesen für Studenten <small>교사용</small></div>
      <div class="spacer"></div>
      <span class="chip" id="liveChip"><span class="dot"></span>연결 중</span>
      <button class="btn btn-sm" id="exportCsv" type="button">CSV</button>
      <button class="btn btn-sm" id="exportJson" type="button">JSON</button>
      <button class="btn btn-sm btn-ghost" id="logout" type="button">로그아웃</button>
    </header>

    <main class="dash">
      <div class="dash-head">
        <div>
          <h1>학생 현황</h1>
          <p class="muted">학생마다 가장 최근 세션의 최종 점수로 그룹을 나눠요. 새 결과가 제출되면 바로 반영돼요.</p>
        </div>
        <form class="levels card" id="levelsForm">
          <label>상위 ≥ <input class="input num" id="hi" type="number" min="0" max="100" step="1" /></label>
          <label>하위 &lt; <input class="input num" id="lo" type="number" min="0" max="100" step="1" /></label>
          <button class="btn btn-sm btn-primary" type="submit">적용</button>
        </form>
      </div>

      <dl class="kpis" id="kpis"></dl>

      <div class="groups">
        <section class="group" data-level="high"><header><h2>상위</h2><span class="chip good" data-count></span></header><div class="list"></div></section>
        <section class="group" data-level="medium"><header><h2>중위</h2><span class="chip warn" data-count></span></header><div class="list"></div></section>
        <section class="group" data-level="low"><header><h2>하위</h2><span class="chip bad" data-count></span></header><div class="list"></div></section>
      </div>
    </main>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" hidden aria-label="학생 상세"></aside>
  </div>

  <script type="module" src="/static/js/admin.js"></script>
</body>
</html>
