# Deployment metadata for Vercel. Local development and CI install
# backend/requirements.txt, which lists the same packages.
[project]
name = "lesen-fuer-studenten"
version = "0.3.0"
description = "Webcam eye tracking for German reading practice"
requires-python = "~=3.13.0"
dependencies = [
    "fastapi>=0.137,<1",
    "uvicorn[standard]>=0.49,<1",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "anthropic>=2,<3",
]

[tool.vercel]
entrypoint = "backend.main:app"
